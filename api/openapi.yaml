openapi: 3.1.0
info:
  title: NexSpaces API
  version: 0.1.0
servers:
  - url: http://localhost:8080/api/v1
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Student:
      type: object
      required:
        - id
        - first_name
        - last_name
        - email
      properties:
        id:
          type: string
          format: uuid
        first_name:
          type: string
        last_name:
          type: string
        email:
          type: string
          format: email
    StudentCreate:
      type: object
      required:
        - first_name
        - last_name
        - email
      properties:
        first_name:
          type: string
        last_name:
          type: string
        email:
          type: string
          format: email
    GenericEntity:
      type: object
      additionalProperties: true
    GenericList:
      type: array
      items:
        $ref: '#/components/schemas/GenericEntity'
security:
  - BearerAuth: []
paths:
  /health:
    get:
      tags: [System]
      summary: Health check
      description: Returns API status information.
      security: []
      responses:
        '200':
          description: Healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  environment:
                    type: string
                  message:
                    type: string
  /public/websites/slug/{slug}:
    get:
      tags: [Public]
      summary: Get public website by slug
      security: []
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Website details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericEntity'
  /auth/register:
