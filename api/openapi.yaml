openapi: 3.1.0
info:
  title: Keystone API
  version: 0.1.0
servers:
  - url: http://localhost:8080/api/v1
    description: Local development
security:
  - BearerAuth: []
tags:
  - name: System
  - name: Auth
  - name: Public
  - name: Tenant
  - name: User
  - name: Website
  - name: Student
  - name: Lesson
  - name: Assignment
  - name: Availability
  - name: Appointment
  - name: Service
  - name: Blog
  - name: Payment
  - name: Upload
  - name: Registry
paths:
  /health:
    get:
      tags: [System]
      summary: Health check
      security: []
      responses:
        '200':
          description: API status information
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
  /public/websites/slug/{slug}:
    get:
      tags: [Public]
      summary: Get public website by slug
      security: []
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Published website details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebsiteResponse'
        '404':
          description: Website not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /auth/register:
    post:
      tags: [Auth]
      summary: Register tenant user
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: Registered user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserEnvelope'
        '400':
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /auth/login:
    post:
      tags: [Auth]
      summary: Authenticate user
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Authentication result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '401':
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /auth/logout:
    post:
      tags: [Auth]
      summary: Logout user (client token revoke)
      responses:
        '200':
          description: Logout acknowledgement
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
  /auth/me:
    get:
      tags: [Auth]
      summary: Get current authenticated user
      responses:
        '200':
          description: Current user profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserEnvelope'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /tenants:
    get:
      tags: [Tenant]
      summary: List tenants
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: per_page
          in: query
          schema:
            type: integer
            default: 20
        - name: status
          in: query
          schema:
            type: string
        - name: plan
          in: query
          schema:
            type: string
        - name: search
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Paginated tenant list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantListEnvelope'
    post:
      tags: [Tenant]
      summary: Create tenant
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TenantCreateRequest'
      responses:
        '201':
          description: Tenant created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantEnvelope'
        '400':
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /tenants/current:
    get:
      tags: [Tenant]
      summary: Get tenant of authenticated user
      responses:
        '200':
          description: Tenant details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantEnvelope'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /tenants/stats:
    get:
      tags: [Tenant]
      summary: Tenant statistics
      responses:
        '200':
          description: Aggregated tenant statistics
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantStatsEnvelope'
  /tenants/slug/{slug}:
    get:
      tags: [Tenant]
      summary: Get tenant by slug
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Tenant details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantEnvelope'
        '404':
          description: Tenant not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /tenants/{id}:
    get:
      tags: [Tenant]
      summary: Get tenant by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Tenant details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantEnvelope'
        '404':
          description: Tenant not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    patch:
      tags: [Tenant]
      summary: Update tenant profile
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TenantUpdateRequest'
      responses:
        '200':
          description: Updated tenant
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantEnvelope'
    delete:
      tags: [Tenant]
      summary: Delete tenant
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Tenant deleted
        '400':
          description: Cannot delete tenant
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /tenants/{id}/suspend:
    post:
      tags: [Tenant]
      summary: Suspend tenant
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TenantSuspendRequest'
      responses:
        '200':
          description: Suspension result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
  /tenants/{id}/activate:
    post:
      tags: [Tenant]
      summary: Activate tenant
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Activation result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
  /tenants/{id}/upgrade:
    post:
      tags: [Tenant]
      summary: Upgrade tenant plan
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TenantUpgradeRequest'
      responses:
        '200':
          description: Upgraded tenant
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantEnvelope'
  /tenants/{id}/domain:
    post:
      tags: [Tenant]
      summary: Set custom domain
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TenantDomainRequest'
      responses:
        '200':
          description: Updated tenant domain
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantEnvelope'
  /tenants/{id}/domain/verify:
    post:
      tags: [Tenant]
      summary: Verify custom domain
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Verification result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantEnvelope'
  /tenants/{id}/branding:
    patch:
      tags: [Tenant]
      summary: Update tenant branding
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TenantBrandingUpdateRequest'
      responses:
        '200':
          description: Updated tenant branding
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantEnvelope'
        '400':
          description: Invalid branding payload
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /users:
    get:
      tags: [User]
      summary: List users
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: per_page
          in: query
          schema:
            type: integer
            default: 20
        - name: role
          in: query
          schema:
            type: string
        - name: status
          in: query
          schema:
            type: string
        - name: search
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Paginated users
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserListEnvelope'
    post:
      tags: [User]
      summary: Create user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserCreateRequest'
      responses:
        '201':
          description: Created user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserEnvelope'
  /users/stats:
    get:
      tags: [User]
      summary: User statistics
      responses:
        '200':
          description: Aggregated user statistics
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserStatsEnvelope'
  /users/{id}:
    get:
      tags: [User]
      summary: Get user by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: User details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserEnvelope'
        '404':
          description: User not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    patch:
      tags: [User]
      summary: Update user profile
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserUpdateRequest'
      responses:
        '200':
          description: Updated user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserEnvelope'
    delete:
      tags: [User]
      summary: Delete user
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: User deleted
  /users/{id}/password:
    post:
      tags: [User]
      summary: Update user password
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserPasswordUpdateRequest'
      responses:
        '200':
          description: Password updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
  /users/{id}/role:
    post:
      tags: [User]
      summary: Update user role
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserRoleUpdateRequest'
      responses:
        '200':
          description: Updated user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserEnvelope'
  /users/{id}/suspend:
    post:
      tags: [User]
      summary: Suspend user
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserSuspendRequest'
      responses:
        '200':
          description: Suspension result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
  /users/{id}/activate:
    post:
      tags: [User]
      summary: Activate user
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Activation result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
  /users/{id}/verify-email:
    post:
      tags: [User]
      summary: Verify user email
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Verification result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
  /websites:
    get:
      tags: [Website]
      summary: List tenant websites
      responses:
        '200':
          description: Website list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebsiteListResponse'
    post:
      tags: [Website]
      summary: Create website
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WebsiteCreateRequest'
      responses:
        '201':
          description: Created website
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebsiteResponse'
  /websites/{id}:
    get:
      tags: [Website]
      summary: Get website by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Website
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebsiteResponse'
    patch:
      tags: [Website]
      summary: Update website
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WebsiteUpdateRequest'
      responses:
        '200':
          description: Updated website
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebsiteResponse'
    delete:
      tags: [Website]
      summary: Delete website
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Website deleted
  /websites/slug/{slug}:
    get:
      tags: [Website]
      summary: Get tenant website by slug
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Website details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebsiteResponse'
  /websites/{id}/publish:
    post:
      tags: [Website]
      summary: Publish website
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Published website
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebsiteResponse'
  /websites/{id}/archive:
    post:
      tags: [Website]
      summary: Archive website
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Archived website
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebsiteResponse'
  /students:
    get:
      tags: [Student]
      summary: List students
      parameters:
        - name: status
          in: query
          schema:
            type: string
        - name: level
          in: query
          schema:
            type: string
        - name: search
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            default: 10
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
      responses:
        '200':
          description: Students
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StudentListResponse'
    post:
      tags: [Student]
      summary: Create student
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StudentCreateRequest'
      responses:
        '201':
          description: Created student
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StudentResponse'
  /students/stats:
    get:
      tags: [Student]
      summary: Student statistics
      responses:
        '200':
          description: Student stats
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StudentStatsResponse'
  /students/email:
    get:
      tags: [Student]
      summary: Get student by email
      parameters:
        - name: email
          in: query
          required: true
          schema:
            type: string
            format: email
      responses:
        '200':
          description: Student
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StudentResponse'
  /students/{id}:
    get:
      tags: [Student]
      summary: Get student by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Student
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StudentResponse'
    put:
      tags: [Student]
      summary: Update student
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StudentUpdateRequest'
      responses:
        '200':
          description: Updated student
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StudentResponse'
    delete:
      tags: [Student]
      summary: Delete student
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Student deleted
  /students/{student_id}/lessons:
    get:
      tags: [Student]
      summary: List lessons for student
      parameters:
        - name: student_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Lessons for student
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LessonListResponse'
  /students/{student_id}/assignments:
    get:
      tags: [Student]
      summary: List assignments for student
      parameters:
        - name: student_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Assignments for student
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssignmentListResponse'
  /lessons:
    get:
      tags: [Lesson]
      summary: List lessons
      responses:
        '200':
          description: Lessons
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LessonListResponse'
    post:
      tags: [Lesson]
      summary: Create lesson
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LessonCreateRequest'
      responses:
        '201':
          description: Created lesson
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LessonResponse'
  /lessons/stats:
    get:
      tags: [Lesson]
      summary: Lesson statistics
      responses:
        '200':
          description: Lesson stats
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LessonStatsResponse'
  /lessons/upcoming:
    get:
      tags: [Lesson]
      summary: Upcoming lessons
      responses:
        '200':
          description: Upcoming lessons
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LessonListResponse'
  /lessons/{id}:
    get:
      tags: [Lesson]
      summary: Get lesson by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Lesson
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LessonResponse'
    put:
      tags: [Lesson]
      summary: Update lesson
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LessonUpdateRequest'
      responses:
        '200':
          description: Updated lesson
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LessonResponse'
    delete:
      tags: [Lesson]
      summary: Delete lesson
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Lesson deleted
  /lessons/{id}/students:
    get:
      tags: [Lesson]
      summary: List students for lesson
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Students attending lesson
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StudentListResponse'
  /assignments:
    get:
      tags: [Assignment]
      summary: List assignments
      responses:
        '200':
          description: Assignments
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssignmentListResponse'
    post:
      tags: [Assignment]
      summary: Create assignment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssignmentCreateRequest'
      responses:
        '201':
          description: Created assignment
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssignmentResponse'
  /assignments/stats:
    get:
      tags: [Assignment]
      summary: Assignment statistics
      responses:
        '200':
          description: Assignment stats
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssignmentStatsResponse'
  /assignments/overdue:
    get:
      tags: [Assignment]
      summary: Overdue assignments
      responses:
        '200':
          description: Overdue assignments
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssignmentListResponse'
  /assignments/{id}:
    get:
      tags: [Assignment]
      summary: Get assignment by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Assignment
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssignmentResponse'
    put:
      tags: [Assignment]
      summary: Update assignment
      parameters:
        - name: id
          in: path
          required: true
