components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required: [error]
    MessageResponse:
      type: object
      properties:
        message:
          type: string
      required: [message]
    HealthResponse:
      type: object
      properties:
        status:
          type: string
        environment:
          type: string
        message:
          type: string
    RegisterRequest:
      type: object
      properties:
        tenant_id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        password:
          type: string
          format: password
        first_name:
          type: string
        last_name:
          type: string
      required: [tenant_id, email, password, first_name, last_name]
    LoginRequest:
      type: object
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password
        tenant_id:
          type: string
          format: uuid
          nullable: true
      required: [email, password]
    LoginResponse:
      type: object
      properties:
        user:
          $ref: '#/components/schemas/User'
        access_token:
          type: string
        refresh_token:
          type: string
          nullable: true
        expires_in:
          type: integer
          description: Token lifetime in seconds
      required: [user, access_token, expires_in]
    TenantCreateRequest:
      type: object
      properties:
        name:
          type: string
        slug:
          type: string
        email:
          type: string
          format: email
        phone:
          type: string
        plan:
          type: string
          enum: [free, starter, pro, enterprise]
      required: [name, slug, email, plan]
    TenantUpdateRequest:
      type: object
      properties:
        name:
          type: string
        email:
          type: string
          format: email
        phone:
          type: string
    TenantUpgradeRequest:
      type: object
      properties:
        plan:
          type: string
          enum: [free, starter, pro, enterprise]
      required: [plan]
    TenantDomainRequest:
      type: object
      properties:
        domain:
          type: string
      required: [domain]
    TenantSuspendRequest:
      type: object
      properties:
        reason:
          type: string
          nullable: true
    BrandingSettings:
      type: object
      properties:
        logo:
          type: string
          nullable: true
        favicon:
          type: string
          nullable: true
        primary_color:
          type: string
          nullable: true
        secondary_color:
          type: string
          nullable: true
        accent_color:
          type: string
          nullable: true
        font_family:
          type: string
          nullable: true
        custom_css:
          type: string
          nullable: true
    TenantBrandingUpdateRequest:
      type: object
      properties:
        logo:
          type: string
          nullable: true
        favicon:
          type: string
          nullable: true
        primary_color:
          type: string
          nullable: true
        secondary_color:
          type: string
          nullable: true
        accent_color:
          type: string
          nullable: true
        font_family:
          type: string
          nullable: true
        custom_css:
          type: string
          nullable: true
    FeatureLimits:
      type: object
      properties:
        max_users:
          type: integer
        max_websites:
          type: integer
        max_storage:
          type: integer
          format: int64
        custom_domain:
          type: boolean
        api_access:
          type: boolean
    Tenant:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        slug:
          type: string
        email:
          type: string
          format: email
        phone:
