basePath: /
definitions:
  errors.HTTPError:
    properties:
      code:
        type: string
      details: {}
      message:
        type: string
      status:
        type: integer
    type: object
  handlers.CreateTenantRequest:
    properties:
      billing_cycle:
        enum:
        - monthly
        - yearly
        type: string
      custom_domain:
        type: string
      name:
        maxLength: 100
        minLength: 2
        type: string
      owner_email:
        type: string
      owner_first_name:
        maxLength: 100
        minLength: 1
        type: string
      owner_last_name:
        maxLength: 100
        minLength: 1
        type: string
      payment_method_id:
        type: string
      plan_id:
        type: string
      settings:
        additionalProperties: true
        type: object
      slug:
        maxLength: 50
        minLength: 3
        type: string
    required:
    - billing_cycle
    - name
    - owner_email
    - owner_first_name
    - owner_last_name
    - payment_method_id
    - plan_id
    - slug
    type: object
  handlers.CreateTenantResponse:
    properties:
      invite_token:
        type: string
      owner:
        $ref: '#/definitions/handlers.UserDTO'
      subscription:
        $ref: '#/definitions/handlers.SubscriptionDTO'
      tenant:
        $ref: '#/definitions/handlers.TenantDTO'
    type: object
  handlers.SubscriptionDTO:
    properties:
      billing_cycle:
        type: string
      created_at:
        type: string
      current_period_end:
        type: string
      current_period_start:
        type: string
      current_usage:
        additionalProperties: true
        type: object
      features:
        additionalProperties: true
        type: object
      id:
        type: string
      plan_id:
        type: string
      price_amount:
        type: integer
      price_currency:
        type: string
      status:
        type: string
      tenant_id:
        type: string
      updated_at:
        type: string
      usage_limits:
        additionalProperties: true
        type: object
    type: object
  handlers.TenantDTO:
    properties:
      created_at:
        type: string
      custom_domain:
        type: string
      id:
        type: string
      name:
        type: string
      settings:
        additionalProperties: true
        type: object
      slug:
        type: string
      status:
        type: string
      updated_at:
        type: string
    type: object
  handlers.UserDTO:
    properties:
      created_at:
        type: string
      email:
        type: string
      email_verified:
        type: boolean
      first_name:
        type: string
      id:
        type: string
      last_login_at:
        type: string
      last_name:
        type: string
      role:
        type: string
      status:
        type: string
      tenant_id:
        type: string
      updated_at:
        type: string
    type: object
host: localhost:8080
info:
  contact:
    email: support@nexspaces.com
    name: API Support
    url: https://www.nexspaces.com/support
  description: This is a production-ready multi-tenant SaaS backend built with modern
    Clean Architecture + DDD patterns.
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  termsOfService: http://swagger.io/terms/
  title: NexSpaces API
  version: "1.0"
paths:
  /api/tenants:
    post:
      consumes:
      - application/json
      description: Creates a new tenant along with an owner user and a subscription.
      parameters:
      - description: Tenant Creation Request
        in: body
        name: tenant
        required: true
        schema:
          $ref: '#/definitions/handlers.CreateTenantRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/handlers.CreateTenantResponse'
        "400":
          description: Invalid request body or validation error
          schema:
            $ref: '#/definitions/errors.HTTPError'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/errors.HTTPError'
      summary: Create a new tenant
      tags:
      - Tenants
schemes:
- http
- https
securityDefinitions:
  ApiKeyAuth:
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
