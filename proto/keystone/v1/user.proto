syntax = "proto3";

package keystone.v1;

option go_package = "github.com/canakyuz/keystone/internal/grpc/keystonev1;keystonev1";

// UserService reads users within the caller's tenant.
//
// It exists on the gRPC surface for one specific reason: it is the endpoint the isolation
// tests drive. A contract that is only exercised by its own tests proves the codegen
// works; running the same cross-tenant assertions through it proves the isolation holds
// on this surface too, which is the claim that matters.
service UserService {
  // ListUsers returns users belonging to the caller's tenant.
  //
  // There is no tenant field in the request, and that is the point. The tenant comes from
  // the verified token in the request metadata, exactly as it does over HTTP. A tenant
  // parameter would be a field the caller controls, and the whole isolation story rests
  // on the caller not controlling it.
  rpc ListUsers(ListUsersRequest) returns (ListUsersResponse);
}

message ListUsersRequest {
  int32 limit = 1;
  int32 offset = 2;
}

message User {
  string id = 1;
  string tenant_id = 2;
  string email = 3;
  string first_name = 4;
  string last_name = 5;
  string role = 6;
  string status = 7;
}

message ListUsersResponse {
  repeated User users = 1;
  int64 total = 2;
}
